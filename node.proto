syntax = "proto3";
option go_package = "Ricart-Agrawala/pb";

message Request {
    int32 node_id = 1;
    int64 timestamp = 2;
}

message Reply {
    int32 node_id = 1;
    int64 timestamp =2;
}

service NodeService {
    rpc SendRequest(Request) returns (Ack);
    rpc SendReply(Reply) returns (Ack);
}

message Ack {}